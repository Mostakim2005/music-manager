    <!-- Second M (Layer 2, overlapping & adjacent offset) -->
    <path
      d="M 202 340 L 202 194 C 202 179 219 171 230 182 L 278 236 C 284 243 294 243 300 236 L 348 182 C 359 171 376 179 376 194 L 376 340"
      stroke="#4F7CFF"
      stroke-width="28"
    />
