<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="m3TileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="m3Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#4F7CFF" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Material 3 Rounded Square Tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#m3TileGrad)" stroke="#334155" stroke-width="2.5" />
  
