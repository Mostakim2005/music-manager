name: PR Check

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

jobs:
  # Validate that the PR title follows Conventional Commits
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint

  # Validate that every commit message follows Conventional Commits
  commit-messages:
    name: Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Validate commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Run lint and type checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The lint:i18n script runs under bun (package.json: "bun scripts/check_i18n.ts"),
      # and the default CI image has no bun, so it fails with "sh: bun: not found"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npx eslint --max-warnings 0 "src/**/*.{ts,tsx,vue,js}"

      # tsconfig.web.json explicitly requires src/renderer/{auto-imports,components}.d.ts.
      # Those files are generated by unplugin-auto-import / unplugin-vue-components when
      # vite starts and are .gitignore-excluded (set deliberately in 58922dc). Running
      # typecheck first fails with TS2688, so run a build once to make unplugin emit them.
      - name: Build (generates auto-import / components d.ts)
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: I18n check
        run: npm run lint:i18n
