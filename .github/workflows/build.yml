name: Build Portable Release

# Tag-triggered cloud build: push a version tag (v*) and GitHub's Windows
# runner builds the portable .exe and attaches it to the GitHub Release.
# Heavy binaries are never committed to git history — they are built here.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-branches:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      summary: ${{ steps.scan.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remote branches and deduplicate by commit SHA
        id: scan
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          node - << 'EOF'
          const { execSync } = require('node:child_process');
          const fs = require('node:fs');

          const rawBranches = execSync("git for-each-ref --format='%(refname:short)|%(objectname)|%(objectname:short=7)' refs/remotes/origin/", { encoding: 'utf8' })
            .trim()
            .split('\n')
            .filter(Boolean);

          const bySha = new Map();
          for (const line of rawBranches) {
            const [ref, fullSha, shortSha] = line.split('|');
            if (!ref || ref === 'origin/HEAD' || ref === 'origin') continue;
            const branch = ref.replace(/^origin\//, '');

            try {
              execSync(`git cat-file -e ${fullSha}:package.json`, { stdio: 'ignore' });
            } catch {
              console.log(`Skipping branch ${branch} (${shortSha}): no package.json`);
              continue;
            }

            let version = '0.0.0';
            try {
              const pkgRaw = execSync(`git show ${fullSha}:package.json`, { encoding: 'utf8' });
              version = JSON.parse(pkgRaw).version || '0.0.0';
            } catch {}

            if (!bySha.has(fullSha)) {
              bySha.set(fullSha, {
                branches: [branch],
                full_sha: fullSha,
                short_sha: shortSha,
                version
              });
            } else {
              bySha.get(fullSha).branches.push(branch);
            }
          }

          const items = Array.from(bySha.values()).map((entry) => {
            entry.branches.sort((a, b) => (a === 'main' ? -1 : b === 'main' ? 1 : a.localeCompare(b)));
            const joinedBranch = entry.branches.join('+');
            const slug = entry.branches
              .map((b) => b.replace(/[^a-zA-Z0-9._-]+/g, '-').replace(/^-+|-+$/g, ''))
              .join('-and-');
            return {
              branch: joinedBranch,
              slug,
              full_sha: entry.full_sha,
              short_sha: entry.short_sha,
              version: entry.version
            };
          });

          const summary = items.map((i) => `${i.branch}@${i.short_sha}`).join(', ');
          const matrixObj = { include: items };
          console.log('Discovered deduplicated Electron branches:', matrixObj);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrixObj)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `summary=${summary}\n`);
          EOF

  build-portable:
    needs: [discover-branches]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-branches.outputs.matrix) }}
    steps:
      - name: Checkout branch (${{ matrix.branch }} @ ${{ matrix.short_sha }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.full_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Generates the gitignored auto-import/component type stubs that the
      # type checks require on a fresh checkout, and catches bundle errors early.
      - name: Build bundle (generates type stubs)
        run: npm run build

      - name: Type checks
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: English sweep gate
        run: node .sweep-gate.mjs

      - name: Build portable .exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:portable

      - name: Build NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:installer

      - name: Standardize Self-Identifying Binary Names
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
          SLUG: ${{ matrix.slug }}
          SHA: ${{ matrix.short_sha }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          PREFIX="MusicManager-Electron-Chromium-v${VERSION}-branch-${SLUG}-${SHA}"

          PORTABLE_SRC=$(find dist -maxdepth 1 -name '*Portable*.exe' 2>/dev/null | head -n 1 || true)
          if [ -n "$PORTABLE_SRC" ]; then
            cp "$PORTABLE_SRC" "dist-release/${PREFIX}-Portable.exe"
          fi

          SETUP_SRC=$(find dist -maxdepth 1 -name '*Setup*.exe' 2>/dev/null | head -n 1 || true)
          if [ -n "$SETUP_SRC" ]; then
            cp "$SETUP_SRC" "dist-release/${PREFIX}-Setup.exe"
          fi

          ls -lh dist-release/

      - name: Upload build artifacts (${{ matrix.slug }})
        uses: actions/upload-artifact@v4
        with:
          name: MusicManager-Electron-Chromium-Windows-${{ matrix.slug }}-${{ matrix.short_sha }}
          path: dist-release/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Music Manager [Electron-Chromium] ${{ github.ref_name }} (Branches: ${{ needs.discover-branches.outputs.summary }})"
          files: dist-release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
